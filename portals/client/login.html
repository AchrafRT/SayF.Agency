<!doctype html>
<html lang="{{lang}}" data-theme="{{theme}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{app_name}} — Login</title>
  <style>
:root{
  --bg:#0b0f17;
  --panel:#111827;
  --panel2:#0f172a;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --line:#223047;
  --brand:#4ade80;
  --brand2:#22c55e;
  --danger:#f87171;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
  --cardbg: rgba(15,23,42,.65);
  --cardbg2: rgba(15,23,42,.55);
  --inputbg: rgba(3,7,18,.55);
  --radius:16px;
  --radius2:20px;
  --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font);
  background: radial-gradient(1000px 700px at 20% 10%, rgba(34,197,94,.10), transparent 60%),
              radial-gradient(900px 600px at 80% 30%, rgba(59,130,246,.08), transparent 60%),
              var(--bg);
  color:var(--text);
}
a{color:inherit; text-decoration:none}
.container{max-width:1200px; margin:0 auto; padding:20px}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px;
  background: linear-gradient(180deg, rgba(17,24,39,.92), rgba(17,24,39,.75));
  border:1px solid var(--line); border-radius:var(--radius2); box-shadow:var(--shadow);
}
.brand{display:flex; align-items:center; gap:10px}
.logo-img{width:34px; height:34px; border-radius:12px; display:block; box-shadow: 0 6px 18px rgba(22,163,74,.20)}
.brand h1{font-size:16px; margin:0; letter-spacing:.2px}
.pill{display:inline-block; padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:rgba(15,23,42,.7); font-size:12px}
.small{font-size:12px}
.muted{color:var(--muted)}
.row{display:flex; align-items:center; gap:12px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{height:16px}
.grid{display:grid; grid-template-columns: 260px 1fr; gap:18px; margin-top:18px}
.sidebar{
  background: rgba(17,24,39,.85);
  border:1px solid var(--line); border-radius:var(--radius2); box-shadow:var(--shadow);
  padding:12px;
}
.nav a{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; margin:2px 0;
  color:var(--text); border:1px solid transparent;
}
.nav a.active{background:rgba(74,222,128,.12); border-color:rgba(74,222,128,.25)}
.nav a:hover{background:rgba(255,255,255,.04)}
.main{
  background: rgba(17,24,39,.85);
  border:1px solid var(--line); border-radius:var(--radius2); box-shadow:var(--shadow);
  padding:16px;
}
.card{
  background: var(--cardbg);
  border:1px solid var(--line);
  border-radius:var(--radius2);
  padding:16px;
}
.card.mini{padding:12px}
h2{margin:0 0 4px 0; font-size:18px}
h3{margin:18px 0 8px 0; font-size:14px; color:var(--muted); letter-spacing:.2px; text-transform:uppercase}
.kpis{display:grid; gap:12px; margin-top:14px}
.kpis-5{grid-template-columns: repeat(5, minmax(0, 1fr))}
.kpis-3{grid-template-columns: repeat(3, minmax(0, 1fr))}
.kpi{
  background: var(--cardbg2);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}
.kpi-num{font-size:22px; font-weight:800; letter-spacing:.2px}
.kpi-label{font-size:12px; color:var(--muted); margin-top:6px}
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  padding:10px 14px; border-radius:14px;
  border:1px solid rgba(74,222,128,.35);
  background: rgba(74,222,128,.16);
  color: var(--text);
  font-weight:700;
  cursor:pointer;
}
.btn:hover{background: rgba(74,222,128,.22)}
.btn-ghost{
  border-color: var(--line);
  background: rgba(255,255,255,.03);
  font-weight:600;
}
.btn-ghost:hover{background: rgba(255,255,255,.06)}
.btn.danger, .btn-ghost.danger{border-color: rgba(248,113,113,.35)}
.btn-ghost.danger{color: #fecaca}
.table{width:100%; border-collapse:separate; border-spacing:0 10px}
.table th{font-size:12px; text-align:left; color:var(--muted); font-weight:700; padding:0 10px}
.table td{
  padding:12px 10px;
  background: var(--cardbg2);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.table tr td:first-child{border-left:1px solid var(--line); border-top-left-radius:14px; border-bottom-left-radius:14px}
.table tr td:last-child{border-right:1px solid var(--line); border-top-right-radius:14px; border-bottom-right-radius:14px}
.right{text-align:right}
.list{margin:0; padding-left:18px}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
input, select, textarea{
  width:100%;
  background: var(--inputbg);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  color: var(--text);
  outline:none;
}
textarea{resize:vertical}
.grid2{display:grid; grid-template-columns: 1fr 1fr; gap:12px}
.filters{margin-top:12px}
.modal{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-backdrop{position:absolute; inset:0; background: rgba(0,0,0,.55)}
.modal-card{
  position:relative;
  width:min(760px, 95vw);
  background: rgba(17,24,39,.96);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow: var(--shadow);
  padding:16px;
}
.modal-title{font-weight:900; font-size:16px}
.flash{margin-top:12px; padding:10px 12px; border-radius:14px; border:1px solid rgba(74,222,128,.25); background: rgba(74,222,128,.08)}
@media (max-width: 980px){
  .grid{grid-template-columns: 1fr}
  .kpis-5{grid-template-columns: repeat(2, minmax(0, 1fr))}
  .kpis-3{grid-template-columns: repeat(1, minmax(0, 1fr))}
  .grid2{grid-template-columns: 1fr}
}

    .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
    .login-card{width:min(520px, 96vw); padding:18px}
    .login-card h2{margin:0; font-size:20px}
    .hint{margin-top:10px; font-size:12px; color:var(--muted)}
  
html[data-theme="light"]{
  --bg:#f5f7fb;
  --panel:#ffffff;
  --panel2:#f0f4ff;
  --text:#0b1220;
  --muted:#44546a;
  --line:#d6deea;
  --brand:#16a34a;
  --brand2:#15803d;
  --danger:#b91c1c;
  --shadow: 0 8px 24px rgba(10,20,40,.12);
  --cardbg: rgba(255,255,255,.92);
  --cardbg2: rgba(255,255,255,.96);
  --inputbg: rgba(255,255,255,.98);
}
</style>
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand">
        <img class="logo-img" src="/static/logo.svg" alt="{{app_name}}" />
        <div>
          <h2>{{app_name}}</h2>
          <div class="muted small">Deterministic • Local • Zero‑dependency</div>
        </div>
      </div>

      <div class="spacer"></div>

      {{error_block}}

      <form method="POST" action="/{{kind}}/login">
        <div class="field">
          <label>Username</label>
          <input name="username" autocomplete="username" required />
        </div>
        <div class="spacer"></div>
        <div class="field">
          <label>Password</label>
          <input name="password" type="password" autocomplete="current-password" required />
        </div>

        <div class="spacer"></div>
        <button class="btn" type="submit">Login</button>

        <div class="hint">
          Admin: <span class="pill">admin / admin</span> • Client: <span class="pill">DemenageursPlus / admin</span>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
