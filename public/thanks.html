<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Thanks</title>
  <style>
:root{
  --bg:#0b0f17;
  --panel:#111827;
  --panel2:#0f172a;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --line:#223047;
  --brand:#4ade80;
  --brand2:#22c55e;
  --danger:#f87171;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
  --radius:16px;
  --radius2:20px;
  --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font);
  background: radial-gradient(1000px 700px at 20% 10%, rgba(34,197,94,.10), transparent 60%),
              radial-gradient(900px 600px at 80% 30%, rgba(59,130,246,.08), transparent 60%),
              var(--bg);
  color:var(--text);
}
a{color:inherit; text-decoration:none}
.container{max-width:1200px; margin:0 auto; padding:20px}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 18px;
  background: linear-gradient(180deg, rgba(17,24,39,.92), rgba(17,24,39,.75));
  border:1px solid var(--line); border-radius:var(--radius2); box-shadow:var(--shadow);
}
.brand{display:flex; align-items:center; gap:10px}
.logo{
  width:34px; height:34px; border-radius:12px;
  background: linear-gradient(135deg, rgba(74,222,128,.95), rgba(34,197,94,.55));
  box-shadow: 0 6px 18px rgba(34,197,94,.20);
}
.brand h1{font-size:16px; margin:0; letter-spacing:.2px}
.pill{display:inline-block; padding:5px 10px; border-radius:999px; border:1px solid var(--line); background:rgba(15,23,42,.7); font-size:12px}
.small{font-size:12px}
.muted{color:var(--muted)}
.row{display:flex; align-items:center; gap:12px}
.row.wrap{flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{height:16px}
.grid{display:grid; grid-template-columns: 260px 1fr; gap:18px; margin-top:18px}
.sidebar{
  background: rgba(17,24,39,.85);
  border:1px solid var(--line); border-radius:var(--radius2); box-shadow:var(--shadow);
  padding:12px;
}
.nav a{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; margin:2px 0;
  color:var(--text); border:1px solid transparent;
}
.nav a.active{background:rgba(74,222,128,.12); border-color:rgba(74,222,128,.25)}
.nav a:hover{background:rgba(255,255,255,.04)}
.main{
  background: rgba(17,24,39,.85);
  border:1px solid var(--line); border-radius:var(--radius2); box-shadow:var(--shadow);
  padding:16px;
}
.card{
  background: rgba(15,23,42,.65);
  border:1px solid var(--line);
  border-radius:var(--radius2);
  padding:16px;
}
.card.mini{padding:12px}
h2{margin:0 0 4px 0; font-size:18px}
h3{margin:18px 0 8px 0; font-size:14px; color:var(--muted); letter-spacing:.2px; text-transform:uppercase}
.kpis{display:grid; gap:12px; margin-top:14px}
.kpis-5{grid-template-columns: repeat(5, minmax(0, 1fr))}
.kpis-3{grid-template-columns: repeat(3, minmax(0, 1fr))}
.kpi{
  background: rgba(15,23,42,.55);
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
}
.kpi-num{font-size:22px; font-weight:800; letter-spacing:.2px}
.kpi-label{font-size:12px; color:var(--muted); margin-top:6px}
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  padding:10px 14px; border-radius:14px;
  border:1px solid rgba(74,222,128,.35);
  background: rgba(74,222,128,.16);
  color: var(--text);
  font-weight:700;
  cursor:pointer;
}
.btn:hover{background: rgba(74,222,128,.22)}
.btn-ghost{
  border-color: var(--line);
  background: rgba(255,255,255,.03);
  font-weight:600;
}
.btn-ghost:hover{background: rgba(255,255,255,.06)}
.btn.danger, .btn-ghost.danger{border-color: rgba(248,113,113,.35)}
.btn-ghost.danger{color: #fecaca}
.table{width:100%; border-collapse:separate; border-spacing:0 10px}
.table th{font-size:12px; text-align:left; color:var(--muted); font-weight:700; padding:0 10px}
.table td{
  padding:12px 10px;
  background: rgba(15,23,42,.55);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
.table tr td:first-child{border-left:1px solid var(--line); border-top-left-radius:14px; border-bottom-left-radius:14px}
.table tr td:last-child{border-right:1px solid var(--line); border-top-right-radius:14px; border-bottom-right-radius:14px}
.right{text-align:right}
.list{margin:0; padding-left:18px}
.field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px}
input, select, textarea{
  width:100%;
  background: rgba(3,7,18,.55);
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  color: var(--text);
  outline:none;
}
textarea{resize:vertical}
.grid2{display:grid; grid-template-columns: 1fr 1fr; gap:12px}
.filters{margin-top:12px}
.modal{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-backdrop{position:absolute; inset:0; background: rgba(0,0,0,.55)}
.modal-card{
  position:relative;
  width:min(760px, 95vw);
  background: rgba(17,24,39,.96);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow: var(--shadow);
  padding:16px;
}
.modal-title{font-weight:900; font-size:16px}
.flash{margin-top:12px; padding:10px 12px; border-radius:14px; border:1px solid rgba(74,222,128,.25); background: rgba(74,222,128,.08)}
@media (max-width: 980px){
  .grid{grid-template-columns: 1fr}
  .kpis-5{grid-template-columns: repeat(2, minmax(0, 1fr))}
  .kpis-3{grid-template-columns: repeat(1, minmax(0, 1fr))}
  .grid2{grid-template-columns: 1fr}
}
</style>
</head>
<body>
  <div class="container" style="max-width:760px;">
    <div class="card" style="margin-top:40px;">
      <h2>Request received ✅</h2>
      <div class="spacer"></div>
      <div class="muted">
        Your request was added to the dashboard as a new lead.
      </div>
      <div class="spacer"></div>
      <div class="row wrap">
        <a class="btn" href="/">Back to site</a>
        <a class="btn btn-ghost" href="/client/login">Open client portal</a>
      </div>
    </div>
  </div>
</body>
</html>
